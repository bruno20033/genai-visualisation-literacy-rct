# Environment the reported analysis was run in.
#
#   conda env create -f analysis/environment.yml
#   conda activate genai-vizlit
#
# Versions are pinned to what actually produced the results, not to "latest".
# lifelines and statsmodels both matter here: the Cox model's cluster-robust
# covariance and the mixed-model optimiser fallbacks are version-sensitive.
name: genai-vizlit
channels:
  - conda-forge
dependencies:
  - python=3.12.11
  - pandas=2.3.3
  - numpy=1.26.4
  - scipy=1.17.1
  - statsmodels=0.14.6
  - matplotlib=3.10.7
  - patsy=1.0.2
  - jupyterlab
  - pip
  - pip:
      - lifelines==0.30.3
